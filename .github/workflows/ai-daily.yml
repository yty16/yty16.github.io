name: AI Daily Report

on:
  schedule:
    - cron: "0 0 * * *"          # UTC 00:00 == Beijing 08:00
  workflow_dispatch: {}          # manual "Run workflow" button

permissions:
  contents: write
  # No extra scopes needed: GITHUB_TOKEN is auto-injected for public repo read/search.

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (sparse)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          sparse-checkout: |
            assets
            scripts
          sparse-checkout-cone-mode: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate daily report
        env:
          # GitHub Models was retired on 2026-07-30 (endpoint returns 404/410).
          # We now use any OpenAI-compatible provider. OpenRouter's free tier needs
          # no real-name verification, so it is the default. To enable the AI
          # summary, add an OpenRouter (or Groq) API key to the AI_API_KEY secret.
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_API_BASE: ${{ secrets.AI_API_BASE || 'https://openrouter.ai/api/v1' }}
          AI_MODEL: ${{ secrets.AI_MODEL || 'z-ai/glm-5.2:free' }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/gen_ai_daily.py

      - name: Commit & push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3; do
            git fetch origin main
            git reset --mixed origin/main
            git add assets/ai-daily.json assets/ai-daily-history/
            if git diff --cached --quiet; then
              echo "No changes to commit"
              exit 0
            fi
            git commit -m "chore: update AI daily report $(date -u +%F)"
            if git push origin HEAD:main; then
              exit 0
            fi
            sleep 5
          done
          echo "push failed after retries"
          exit 1
