<style>
:root{--bg:#f0f2f5;--card:rgba(255,255,255,0.9);--text:#1a1a2e;--muted:#6b7280;--accent:#6366f1;--accent-hover:#4f46e5;--border:rgba(0,0,0,0.08);--shadow:0 4px 16px rgba(0,0,0,0.08);--r1:#9ca3af;--r2:#22c55e;--r3:#3b82f6;--r4:#a855f7;--r5:#f59e0b}
[data-theme="dark"]{--bg:#0f0f1a;--card:rgba(30,30,50,0.9);--text:#e2e8f0;--muted:#9ca3af;--accent:#818cf8;--accent-hover:#6366f1;--border:rgba(255,255,255,0.08);--shadow:0 4px 16px rgba(0,0,0,0.3);--r1:#6b7280;--r2:#4ade80;--r3:#60a5fa;--r4:#c084fc;--r5:#fbbf24}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;transition:background .3s,color .3s}
.back-btn{position:fixed;top:18px;left:18px;z-index:100;display:inline-flex;align-items:center;gap:6px;padding:8px 16px;background:var(--card);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--border);border-radius:10px;color:var(--text);text-decoration:none;font-size:14px;font-weight:500;box-shadow:var(--shadow);transition:all .2s}
.back-btn:hover{background:var(--accent);color:#fff}
.header{text-align:center;padding:56px 16px 22px}
.header h1{font-size:26px;font-weight:700;letter-spacing:-.5px}
.header p{font-size:14px;color:var(--muted);margin-top:8px}
.stats{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;max-width:720px;margin:0 auto 24px;padding:0 16px}
.stat{flex:1;min-width:110px;max-width:160px;background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px;text-align:center;box-shadow:var(--shadow)}
.stat .n{font-size:22px;font-weight:700;color:var(--accent)}
.stat .l{font-size:12px;color:var(--muted);margin-top:4px}
.container-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;max-width:1200px;margin:0 auto;padding:0 16px 60px}
.ct-card{background:var(--card);border:1px solid var(--border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);transition:transform .2s,border-color .2s;display:flex;flex-direction:column}
.ct-card:hover{transform:translateY(-3px);border-color:var(--accent)}
.ct-header{padding:12px 14px;border-bottom:1px solid var(--border);font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.ct-body{padding:14px;flex:1;display:flex;flex-direction:column;gap:10px}
.ct-img{width:64px;height:64px;object-fit:contain;align-self:center;background:rgba(0,0,0,0.04);border-radius:8px}
.ct-info{font-size:12px;color:var(--muted);line-height:1.7}
.ct-info p{margin:2px 0}
.ct-info .tag{display:inline-block;background:var(--bg);border:1px solid var(--border);border-radius:4px;padding:1px 6px;margin:2px 4px 2px 0}
.ct-footer{padding:10px 14px;border-top:1px solid var(--border);display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{padding:7px 12px;border:none;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;transition:all .15s}
.btn-primary{background:var(--accent);color:#fff}
.btn-primary:hover{background:var(--accent-hover)}
.btn-sm{background:var(--bg);color:var(--text);border:1px solid var(--border)}
.btn-sm:hover{border-color:var(--accent);color:var(--accent)}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);backdrop-filter:blur(4px);z-index:200;display:none;align-items:center;justify-content:center;padding:16px}
.modal-overlay.show{display:flex}
.modal{background:#1e2328;border:1px solid rgba(255,255,255,.1);border-radius:12px;width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.6)}
.modal-header{padding:14px 16px;background:linear-gradient(90deg,rgba(120,25,30,.85),rgba(120,25,30,.35));display:flex;align-items:center;justify-content:space-between;gap:10px}
.modal-header h3{color:#fff;font-size:16px;font-weight:700;display:flex;align-items:center;gap:8px;margin:0}
.modal-header .close{color:rgba(255,255,255,.7);background:none;border:none;font-size:22px;cursor:pointer}
.modal-header .close:hover{color:#fff}
.modal-body{padding:16px;overflow:auto;display:flex;justify-content:center;background:radial-gradient(900px 500px at 30% 15%,rgba(60,90,80,.2),transparent),linear-gradient(180deg,rgba(0,0,0,.1),rgba(0,0,0,.6))}
.grid-frame{position:relative;display:grid;gap:2px;background:rgba(255,255,255,.06);padding:4px;border-radius:6px}
.grid-cell{width:48px;height:48px;background:rgba(255,255,255,.04);border-radius:3px}
.item-layer{position:absolute;inset:4px;display:grid;gap:2px;pointer-events:none}
.item-node{position:relative;border-radius:4px;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;animation:popIn .25s ease}
@keyframes popIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.item-node .thumb-bg{position:absolute;inset:0;opacity:.25}
.item-node .thumb{position:absolute;inset:4px;background-repeat:no-repeat;background-position:center;background-size:contain;z-index:1}
.item-node .label{position:absolute;bottom:1px;left:2px;right:2px;font-size:10px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;z-index:3;text-align:center}
.item-node .price{position:absolute;top:2px;right:2px;font-size:10px;color:#ffd700;font-weight:700;text-shadow:0 1px 2px rgba(0,0,0,.9);z-index:3;display:flex;align-items:center;gap:2px}
.item-node .price::before{content:"";display:inline-block;width:10px;height:10px;background:url(//game.gtimg.cn/images/dfm/cp/a20240807community/swat/swat_gold_icon.png) center/contain no-repeat}
.item-node .cover{position:absolute;inset:0;background:linear-gradient(135deg,#3a4348,#262c30);z-index:5;display:flex;align-items:center;justify-content:center;transition:opacity .3s}
.item-node .cover::after{content:"?";font-size:20px;color:rgba(255,255,255,.4);font-weight:700}
.item-node.revealed .cover{opacity:0;pointer-events:none}
.scan-magnifier{position:absolute;width:42px;height:42px;z-index:10;display:none;pointer-events:none}
.scan-magnifier.show{display:block}
.scan-magnifier .lens{width:100%;height:100%;border:2px solid rgba(100,200,255,.8);border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(150,220,255,.25),transparent 60%);box-shadow:0 0 20px rgba(100,200,255,.4);animation:breathe 1.2s ease-in-out infinite}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.modal-footer{padding:12px 16px;border-top:1px solid rgba(255,255,255,.08);display:flex;gap:10px;justify-content:center}
.modal-footer .btn{min-width:80px}

@media(max-width:600px){.header h1{font-size:22px}.container-grid{grid-template-columns:1fr}.ct-footer{justify-content:center}.modal{max-height:95vh}}
</style>
</head>

var GRADE_WEIGHT = {1:60,2:30,3:10,4:3,5:1};
var GRADE_COLOR = {1:'var(--r1)',2:'var(--r2)',3:'var(--r3)',4:'var(--r4)',5:'var(--r5)'};
var stats = {search:0,items:0,value:0,rare:0};
var scanning = false;

function fixContainerPic(pic){
  if(pic.indexOf('://')===-1 && pic.indexOf('./')===0) return 'https://www.kkrb.net/'+pic.slice(2);
  return pic;
}

function formatPrice(n){
  if(!isFinite(n)||n<=0) return '0';
  if(n<1000) return String(Math.round(n));
  if(n<1000000) return (n/1000).toFixed(1)+'K';
  return (n/1000000).toFixed(1)+'M';
}

function renderContainers(){
  var grid = document.getElementById('containerGrid');
  grid.innerHTML = '';
  for(var i=0;i<CONTAINERS.length;i++){
    var c = CONTAINERS[i];
    var card = document.createElement('div');
    card.className = 'ct-card';

    var header = document.createElement('div');
    header.className = 'ct-header';
    header.textContent = c.name;
    card.appendChild(header);

    var body = document.createElement('div');
    body.className = 'ct-body';
    var img = document.createElement('img');
    img.src = fixContainerPic(c.pic);
    img.className = 'ct-img';
    img.alt = c.name;
    body.appendChild(img);
    var info = document.createElement('div');
    info.className = 'ct-info';
    var types = (c.types||[]).map(function(t){return '<span class="tag">'+escapeHtml(t)+'</span>';}).join('');
    info.innerHTML = '<p><b>主要产物：</b>'+types+'</p>'+
      '<p><b>必出格式：</b>'+escapeHtml(c.real||'无')+'</p>'+
      '<p><b>可能格式：</b>'+escapeHtml(c.maybe||'无')+'</p>'+
      '<p><b>不出格式：</b>'+escapeHtml(c.none||'无')+'</p>';
    body.appendChild(info);
    card.appendChild(body);

    var footer = document.createElement('div');
    footer.className = 'ct-footer';
    var draws = [1,6,12,30];
    var labels = ['开搜','六连搜','十二连搜','三十连搜'];
    for(var j=0;j<draws.length;j++){
      var btn = document.createElement('button');
      btn.className = j===0 ? 'btn btn-primary' : 'btn btn-sm';
      btn.textContent = labels[j];
      (function(cid,dcount){btn.onclick = function(){openSearch(cid,dcount);};})(c.id,draws[j]);
      footer.appendChild(btn);
    }
    card.appendChild(footer);
    grid.appendChild(card);
  }
}

function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function rollItem(){
  var weights = ITEM_POOL.map(function(it){return GRADE_WEIGHT[it.g]||1;});
  var total = weights.reduce(function(a,b){return a+b;},0);
  var r = Math.random()*total;
  var acc = 0;
  for(var i=0;i<ITEM_POOL.length;i++){
    acc += weights[i];
    if(r<=acc) return ITEM_POOL[i];
  }
  return ITEM_POOL[0];
}

function createOccupancy(rows,cols){
  var occ = [];
  for(var r=0;r<rows;r++){occ.push(Array(cols).fill(false));}
  return occ;
}

function canPlace(occ,r,c,w,h){
  if(r+h>occ.length || c+w>occ[0].length) return false;
  for(var rr=r;rr<r+h;rr++){
    for(var cc=c;cc<c+w;cc++){
      if(occ[rr][cc]) return false;
    }
  }
  return true;
}

function markPlace(occ,r,c,w,h){
  for(var rr=r;rr<r+h;rr++){
    for(var cc=c;cc<c+w;cc++){
      occ[rr][cc]=true;
    }
  }
}

function findFirstFit(occ,w,h){
  for(var r=0;r<occ.length;r++){
    for(var c=0;c<occ[0].length;c++){
      if(canPlace(occ,r,c,w,h)) return {r:r,c:c};
    }
  }
  return null;
}

function layoutItems(items,cols,rows){
  var occ = createOccupancy(rows,cols);
  var placements = [];
  for(var i=0;i<items.length;i++){
    var it = items[i];
    var w = Math.max(1,it.w||1);
    var h = Math.max(1,it.h||1);
    var pos = findFirstFit(occ,w,h);
    if(!pos) continue;
    markPlace(occ,pos.r,pos.c,w,h);
    placements.push({r:pos.r,c:pos.c,w:w,h:h,item:it});
  }
  placements.sort(function(a,b){return (a.r-b.r)||(a.c-b.c);});
  return placements;
}

function openSearch(containerId,drawCount){
  if(scanning) return;
  var c = null;
  for(var i=0;i<CONTAINERS.length;i++){if(CONTAINERS[i].id===containerId){c=CONTAINERS[i];break;}}
  if(!c) return;

  var items = [];
  for(var i=0;i<drawCount;i++){
    items.push(rollItem());
  }

  stats.search++;
  stats.items += items.length;
  var totalValue = 0;
  var rare = 0;
  for(var i=0;i<items.length;i++){
    totalValue += items[i].p||0;
    if(items[i].g>=4) rare++;
  }
  stats.value += totalValue;
  stats.rare += rare;
  updateStats();

  showResult(c,items,totalValue);
}

function updateStats(){
  document.getElementById('stSearch').textContent = stats.search;
  document.getElementById('stItems').textContent = stats.items;
  document.getElementById('stValue').textContent = formatPrice(stats.value);
  document.getElementById('stRare').textContent = stats.rare;
}

function showResult(c,items,totalValue){
  var modal = document.getElementById('modal');
  var title = document.getElementById('modalTitle');
  var gridFrame = document.getElementById('gridFrame');
  var itemLayer = document.getElementById('itemLayer');
  var scanner = document.getElementById('scanner');

  title.textContent = c.name + ' 搜索中...';
  modal.classList.add('show');
  scanning = true;

  var cols = c.cols||4, rows = c.rows||4;
  gridFrame.style.gridTemplateColumns = 'repeat('+cols+',48px)';
  gridFrame.style.gridTemplateRows = 'repeat('+rows+',48px)';

  // Build cells
  var cellsHtml = '';
  for(var i=0;i<cols*rows;i++) cellsHtml += '<div class="grid-cell"></div>';
  // replace existing cells but keep itemLayer and scanner
  gridFrame.innerHTML = cellsHtml + itemLayer.outerHTML + scanner.outerHTML;
  // rebind references after rebuilding
  itemLayer = document.getElementById('itemLayer');
  scanner = document.getElementById('scanner');

  var placements = layoutItems(items,cols,rows);

  // Build item nodes
  itemLayer.innerHTML = '';
  var nodes = [];
  for(var i=0;i<placements.length;i++){
    var p = placements[i];
    var it = p.item;
    var node = document.createElement('div');
    node.className = 'item-node';
    node.style.gridColumn = (p.c+1)+' / span '+p.w;
    node.style.gridRow = (p.r+1)+' / span '+p.h;

    var bg = document.createElement('div');
    bg.className = 'thumb-bg';
    bg.style.backgroundColor = GRADE_COLOR[it.g]||GRADE_COLOR[1];
    node.appendChild(bg);

    var thumb = document.createElement('div');
    thumb.className = 'thumb';
    thumb.style.backgroundImage = "url("+it.img+")";
    node.appendChild(thumb);

    var label = document.createElement('div');
    label.className = 'label';
    label.textContent = it.n;
    node.appendChild(label);

    var price = document.createElement('div');
    price.className = 'price';
    price.textContent = formatPrice(it.p||0);
    node.appendChild(price);

    var cover = document.createElement('div');
    cover.className = 'cover';
    node.appendChild(cover);

    itemLayer.appendChild(node);
    nodes.push(node);
  }

  // Scan animation
  var idx = 0;
  function scanNext(){
    if(idx>=nodes.length){
      scanner.classList.remove('show');
      title.innerHTML = escapeHtml(c.name)+'（总价值：<span style="color:#ffd700">'+formatPrice(totalValue)+'</span>）';
      scanning = false;
      return;
    }
    var node = nodes[idx];
    var rect = node.getBoundingClientRect();
    var frameRect = gridFrame.getBoundingClientRect();
    scanner.style.left = (rect.left - frameRect.left + rect.width/2 - 21)+'px';
    scanner.style.top = (rect.top - frameRect.top + rect.height/2 - 21)+'px';
    scanner.classList.add('show');
    setTimeout(function(){
      node.classList.add('revealed');
      idx++;
      setTimeout(scanNext,220);
    },350);
  }
  setTimeout(scanNext,200);
}

function closeModal(){
  document.getElementById('modal').classList.remove('show');
  scanning = false;
}

document.getElementById('modalClose').onclick = closeModal;
document.getElementById('closeBtn2').onclick = closeModal;
document.getElementById('modal').onclick = function(e){if(e.target===this) closeModal();};
document.getElementById('againBtn').onclick = function(){
  // Re-open same container with draw count 1
  var title = document.getElementById('modalTitle').textContent;
  var m = title.match(/^(.+?)(?:\s|（)/);
  if(m){
    var name = m[1];
    for(var i=0;i<CONTAINERS.length;i++){
      if(CONTAINERS[i].name===name){openSearch(CONTAINERS[i].id,1);return;}
    }
  }
};

renderContainers();
</script>
