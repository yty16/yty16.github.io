    <title>中国地铁驾驶模拟器</title>
    <style>
        :root {
            --bg: #0b0f1c;
            --bg2: #16203c;
            --card-bg: rgba(255,255,255,0.06);
            --card-border: rgba(255,255,255,0.12);
            --text: #eaf0ff;
            --text-secondary: #9fb0d0;
            --accent: #4f8cff;
            --accent2: #3a6fe0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: radial-gradient(120% 120% at 50% 0%, #16203c 0%, var(--bg) 60%);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            transition: background 0.3s, color 0.3s;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .container { max-width: 720px; width: 100%; }
        .back-btn {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--accent); text-decoration: none; font-size: 14px;
            margin-bottom: 18px; padding: 8px 16px; border-radius: 10px;
            background: var(--card-bg); border: 1px solid var(--card-border);
            backdrop-filter: blur(10px); align-self: flex-start;
        }
        .back-btn:hover { background: var(--accent); color: #fff; }
        .card {
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 18px; padding: 22px; margin-bottom: 18px;
            backdrop-filter: blur(16px); box-shadow: 0 8px 32px rgba(0,0,0,0.25); width: 100%;
        }
        .hero { text-align: center; background: linear-gradient(135deg, rgba(79,140,255,0.20), rgba(79,140,255,0.06)); border-color: var(--accent); }
        .hero h1 { font-size: 28px; margin-bottom: 8px; }
        .hero h1 span { color: var(--accent); }
        .hero .subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 6px; line-height: 1.6; }
        .section-title { font-size: 16px; font-weight: 600; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
        .note { font-size: 12px; color: var(--text-secondary); line-height: 1.7; margin-bottom: 14px; background: rgba(79,140,255,0.08); border-radius: 10px; padding: 10px 14px; }
        .city-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
        .city-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 14px 6px; border-radius: 14px; text-decoration: none;
            background: var(--card-bg); border: 1px solid var(--card-border);
            color: var(--text); font-size: 15px; font-weight: 600;
            transition: all 0.18s; backdrop-filter: blur(8px);
        }
        .city-btn:hover { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; transform: translateY(-2px); box-shadow: 0 6px 18px rgba(79,140,255,0.4); }
        .city-btn .emoji { font-size: 22px; margin-bottom: 4px; }
        .city-btn .cnt { font-size: 11px; color: var(--text-secondary); font-weight: 400; margin-top: 3px; }
        .city-btn:hover .cnt { color: rgba(255,255,255,0.85); }
        .sim-list { display: flex; flex-direction: column; gap: 10px; }
        .sim-item {
            display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--text);
            padding: 12px 14px; border-radius: 12px; background: var(--card-bg);
            border: 1px solid var(--card-border); transition: all 0.18s; backdrop-filter: blur(8px);
        }
        .sim-item:hover { background: linear-gradient(135deg, var(--accent), var(--accent2)); color: #fff; transform: translateY(-1px); box-shadow: 0 4px 12px rgba(79,140,255,0.3); }
        .sim-item .ic { font-size: 22px; flex-shrink: 0; }
        .sim-item .meta { flex: 1; min-width: 0; }
        .sim-item .name { font-size: 14px; font-weight: 600; }
        .sim-item .desc { font-size: 12px; opacity: 0.8; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .sim-item .go { font-size: 12px; opacity: 0.7; flex-shrink: 0; }
        .tag { font-size: 11px; padding: 1px 7px; border-radius: 6px; background: var(--accent); color: #fff; opacity: 0.9; font-weight: 500; margin-left: 4px; }
        @media (max-width: 600px) {
            body { padding: 12px; }
            .hero h1 { font-size: 22px; }
            .card { padding: 16px; }
            .city-grid { grid-template-columns: repeat(3, 1fr); }

            <div class="city-grid" id="cityGrid"></div>

            <div class="sim-list">
                <a class="sim-item" href="../jinan/">
