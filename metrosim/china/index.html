<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>中国地铁模拟器</title>
<style>
  :root{
    --bg:#f0f2f5; --card-bg:rgba(255,255,255,.7); --card-border:rgba(255,255,255,.3);
    --text:#1a1a2e; --text2:#666; --accent:#6c5ce7; --accent2:#a29bfe;
  }
  [data-theme="dark"]{
    --bg:#1a1a2e; --card-bg:rgba(255,255,255,.05); --card-border:rgba(255,255,255,.1);
    --text:#eee; --text2:#aaa; --accent:#a29bfe; --accent2:#6c5ce7;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{
    font-family:'Inter','Microsoft YaHei',sans-serif; background:var(--bg); color:var(--text);
    min-height:100vh; padding:20px; transition:background .3s,color .3s;
    display:flex; flex-direction:column; align-items:center;
  }
  .container{max-width:760px;width:100%}
  .back-btn{
    display:inline-flex;align-items:center;gap:6px;color:var(--accent);text-decoration:none;
    font-size:14px;margin-bottom:16px;padding:8px 16px;border-radius:8px;
    background:var(--card-bg);border:1px solid var(--card-border);backdrop-filter:blur(10px);
    transition:all .2s;align-self:flex-start;
  }
  .back-btn:hover{background:var(--accent);color:#fff}
  .card{
    background:var(--card-bg);border:1px solid var(--card-border);border-radius:16px;
    padding:20px;margin-bottom:18px;backdrop-filter:blur(20px);box-shadow:0 8px 32px rgba(0,0,0,.1);width:100%;
  }
  h1{font-size:26px;margin-bottom:6px;text-align:center}
  .subtitle{text-align:center;font-size:13px;color:var(--text2);margin-bottom:4px}
  .section-title{font-size:16px;font-weight:600;margin:4px 0 14px;display:flex;align-items:center;gap:8px}
  .note{font-size:12px;color:var(--text2);line-height:1.7;background:rgba(108,92,231,.08);border-radius:10px;padding:10px 14px;margin-bottom:14px}
  .search{
    width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--card-border);
    background:var(--card-bg);color:var(--text);font-size:15px;margin-bottom:14px;outline:none;
  }
  .search::placeholder{color:var(--text2)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:10px}
  .city{
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
    padding:12px 6px;border-radius:12px;text-decoration:none;color:var(--text);
    background:var(--card-bg);border:1px solid var(--card-border);font-size:14px;font-weight:500;
    transition:all .18s;backdrop-filter:blur(8px);position:relative;overflow:hidden;
  }
  .city:hover{background:var(--accent);color:#fff;transform:translateY(-2px);box-shadow:0 4px 12px rgba(108,92,231,.35)}
  .city .emoji{font-size:20px}
  .city .badge{
    position:absolute;top:5px;right:5px;font-size:9px;background:var(--accent);color:#fff;
    padding:1px 6px;border-radius:7px;opacity:.92;font-weight:600;
  }
  .empty{text-align:center;color:var(--text2);padding:24px 0}
  .divider{height:1px;background:var(--card-border);margin:8px 0 16px}
  @media(max-width:600px){ body{padding:12px} h1{font-size:22px} .card{padding:16px} }
</style>
</head>
<body>

  if(t){document.documentElement.setAttribute('data-theme',t);}

<div class="container">
  <a href="../" class="back-btn">← 返回地铁模拟器</a>

  <div class="card">
    <h1>🚇 中国地铁模拟器</h1>
    <p class="subtitle">选择一个城市，跳转到该城市的真实地铁模拟器</p>
  </div>

  <div class="card" style="border-color:var(--accent);background:linear-gradient(135deg,rgba(108,92,231,.18),rgba(108,92,231,.06));">
    <div class="section-title">🏙️ 本地 / 专属真实模拟器</div>
    <div class="note">
      以下两座城市为「真实可玩」的专属模拟器，非本站虚构：<br>
      • <b>济南</b>：本站本地复刻的 3D 驾驶模拟器（含真实线网，可离线运行）。<br>
      • <b>南京</b>：B 站原作者「城市地铁驾驶」真实作品（外部链接）。
    </div>
    <div class="grid" id="featuredGrid"></div>
  </div>

  <div class="card">
    <div class="section-title">🌐 城市设计师（真实线网模拟平台）</div>
    <div class="note">
      其余城市接入第三方真实平台「城市设计师」（citiesdesigners.com），基于真实地图与线网数据，
      支持全球 90+ 城市地铁的线网规划与客流模拟。点击下方城市，将直接打开该城市的真实模拟页面。
    </div>
    <input class="search" id="search" placeholder="搜索城市，如 北京 / 上海 / 成都 …" />
    <div class="grid" id="cityGrid"></div>
    <div class="empty" id="empty" style="display:none">没有找到该城市</div>
  </div>
</div>

<script>
/* 隐藏署名（yty16） */
var _attr="eXR5MTY=";

/* 专属真实模拟器（本地 / 外部，非虚构） */
var FEATURED=[
  {nm:"济南",e:"🚆",url:"../jinan/",badge:"自制·3D驾驶",ext:false},
  {nm:"南京",e:"🚇",url:"https://www.bilibili.com/toy/njmetro-sim/index.html",badge:"B站·原作者",ext:true}
];

/* 其余城市 → 城市设计师真实平台（按拼音打开对应城市） */
var CITIES=[
  {nm:"北京",e:"🏛️",s:"beijing"},{nm:"上海",e:"🌃",s:"shanghai"},{nm:"广州",e:"🏙️",s:"guangzhou"},
  {nm:"深圳",e:"💡",s:"shenzhen"},{nm:"成都",e:"🐼",s:"chengdu"},{nm:"重庆",e:"🌉",s:"chongqing"},
  {nm:"武汉",e:"🌊",s:"wuhan"},{nm:"西安",e:"🏯",s:"xian"},{nm:"杭州",e:"⛩️",s:"hangzhou"},
  {nm:"天津",e:"🌆",s:"tianjin"},{nm:"苏州",e:"🏞️",s:"suzhou"},{nm:"郑州",e:"🐉",s:"zhengzhou"},
  {nm:"长沙",e:"🌶️",s:"changsha"},{nm:"青岛",e:"⚓",s:"qingdao"},{nm:"宁波",e:"⚓",s:"ningbo"},
  {nm:"无锡",e:"🌺",s:"wuxi"},{nm:"昆明",e:"❄️",s:"kunming"},{nm:"沈阳",e:"❄️",s:"shenyang"},
  {nm:"大连",e:"🌊",s:"dalian"},{nm:"厦门",e:"🏝️",s:"xiamen"},{nm:"合肥",e:"🌅",s:"hefei"},
  {nm:"福州",e:"🌳",s:"fuzhou"},{nm:"哈尔滨",e:"❄️",s:"harbin"},{nm:"长春",e:"🌲",s:"changchun"},
  {nm:"南昌",e:"🌷",s:"nanchang"},{nm:"南宁",e:"🌴",s:"nanning"},{nm:"贵阳",e:"⛰️",s:"guiyang"},
  {nm:"石家庄",e:"🏛️",s:"shijiazhuang"},{nm:"太原",e:"🏯",s:"taiyuan"},{nm:"常州",e:"🏭",s:"changzhou"},
  {nm:"徐州",e:"🚉",s:"xuzhou"},{nm:"绍兴",e:"🏞️",s:"shaoxing"},{nm:"洛阳",e:"🏯",s:"luoyang"},
  {nm:"芜湖",e:"🌊",s:"wuhu"},{nm:"南通",e:"🌊",s:"nantong"},{nm:"温州",e:"🌾",s:"wenzhou"},
  {nm:"呼和浩特",e:"🌾",s:"hohhot"},{nm:"乌鲁木齐",e:"🏔️",s:"urumqi"},{nm:"兰州",e:"🌉",s:"lanzhou"},
  {nm:"东莞",e:"🏭",s:"dongguan"},{nm:"香港",e:"🌆",s:"hongkong"},{nm:"台北",e:"🏙️",s:"taipei"}
];

function makeCity(c, isFeatured){
  var a=document.createElement('a');
  a.className='city';
  a.href = isFeatured ? c.url : ('https://www.citiesdesigners.com/'+c.s);
  a.target='_blank'; a.rel='noopener';
  a.title = c.nm+' 地铁模拟（'+(isFeatured?'专属真实模拟器':('城市设计师 · '+c.s)+')');
  a.innerHTML='<span class="emoji">'+c.e+'</span><span>'+c.nm+'</span>'+(c.badge?'<span class="badge">'+c.badge+'</span>':'');
  return a;
}

/* 渲染专属 */
var fg=document.getElementById('featuredGrid');
FEATURED.forEach(function(c){ fg.appendChild(makeCity(c,true)); });

/* 渲染其余城市 */
var cg=document.getElementById('cityGrid');
function renderCities(filter){
  cg.innerHTML='';
  var list=CITIES.filter(function(c){ return !filter || c.nm.indexOf(filter)>-1; });
  document.getElementById('empty').style.display = list.length?'none':'block';
  list.forEach(function(c){ cg.appendChild(makeCity(c,false)); });
}
document.getElementById('search').addEventListener('input',function(e){ renderCities(e.target.value.trim()); });
renderCities('');
</script>
</body>
</html>
