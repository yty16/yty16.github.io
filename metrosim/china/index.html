<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>中国地铁模拟器</title>
<style>
  :root{
    --bg:#0f1420; --bg2:#161d2e; --card:rgba(255,255,255,.06);
    --card2:rgba(255,255,255,.09); --border:rgba(255,255,255,.12);
    --text:#e8edf7; --muted:#9aa6bd; --accent:#3da9fc; --accent2:#5ee0a0;
    --danger:#ff6b6b; --warn:#ffd166; --radius:16px;
  }
  html[data-theme="light"]{
    --bg:#eef2f8; --bg2:#e3e9f3; --card:rgba(20,30,50,.05);
    --card2:rgba(20,30,50,.08); --border:rgba(20,30,50,.12);
    --text:#16203a; --muted:#5a6party; --muted:#5a667e; --accent:#1f7ad6; --accent2:#1faa6a;
    --danger:#d83a3a; --warn:#c79100;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 70% -10%,#1d2942 0%,var(--bg) 55%) fixed,var(--bg);
    color:var(--text);min-height:100%;overflow-x:hidden;
  }
  .wrap{max-width:880px;margin:0 auto;padding:18px 16px 40px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  .back{
    border:1px solid var(--border);background:var(--card);color:var(--text);
    width:40px;height:40px;border-radius:12px;font-size:18px;cursor:pointer;flex-shrink:0;
    display:flex;align-items:center;justify-content:center;transition:.15s;
  }
  .back:hover{background:var(--card2)}
  .title{font-size:22px;font-weight:800;letter-spacing:.5px}
  .sub{font-size:13px;color:var(--muted);margin-top:2px}
  .search{
    width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--border);
    background:var(--card);color:var(--text);font-size:15px;margin:6px 0 14px;outline:none;
  }
  .search::placeholder{color:var(--muted)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px}
  .city{
    border:1px solid var(--border);background:var(--card);border-radius:14px;
    padding:12px 8px;text-align:center;cursor:pointer;transition:.15s;position:relative;overflow:hidden;
  }
  .city:hover{background:var(--card2);transform:translateY(-2px)}
  .city .em{font-size:22px;line-height:1}
  .city .nm{font-size:14px;font-weight:700;margin-top:6px}
  .city .ct{font-size:11px;color:var(--muted);margin-top:2px}
  .city .badge{position:absolute;top:6px;right:6px;font-size:10px;background:var(--accent);color:#fff;padding:1px 6px;border-radius:8px}
  .lines{display:flex;flex-direction:column;gap:10px;margin-top:6px}
  .line{
    display:flex;align-items:center;gap:12px;border:1px solid var(--border);
    background:var(--card);border-radius:14px;padding:12px 14px;cursor:pointer;transition:.15s;
  }
  .line:hover{background:var(--card2);transform:translateY(-2px)}
  .line .dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;box-shadow:0 0 0 4px rgba(255,255,255,.08)}
  .line .meta{flex:1;min-width:0}
  .line .ln{font-size:15px;font-weight:700}
  .line .st{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
  .line .go{font-size:13px;color:var(--accent);flex-shrink:0}
  /* play */
  .hud{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
  .pill{border:1px solid var(--border);background:var(--card);border-radius:999px;padding:6px 12px;font-size:13px;font-weight:700}
  .pill b{color:var(--accent2)}
  .stage{position:relative;border:1px solid var(--border);border-radius:16px;overflow:hidden;background:linear-gradient(180deg,#0b1020,#0e1530);aspect-ratio:16/9}
  html[data-theme="light"] .stage{background:linear-gradient(180deg,#dde6f5,#cdd9ee)}
  canvas{display:block;width:100%;height:100%}
  .ctrl{display:flex;gap:10px;margin-top:12px}
  .btn{
    flex:1;border:1px solid var(--border);background:var(--card);color:var(--text);
    padding:16px 0;border-radius:14px;font-size:16px;font-weight:800;cursor:pointer;user-select:none;transition:.1s;
  }
  .btn:active{transform:scale(.97);background:var(--card2)}
  .btn.acc{background:linear-gradient(180deg,#3da9fc,#2b86d6);border-color:transparent;color:#fff}
  .btn.brk{background:linear-gradient(180deg,#ff8a5b,#e8633a);border-color:transparent;color:#fff}
  .btn.go{background:linear-gradient(180deg,#5ee0a0,#36c285);border-color:transparent;color:#06281a}
  .ann{
    margin-top:10px;min-height:22px;text-align:center;font-size:15px;font-weight:700;color:var(--warn);
    transition:.2s;opacity:0;
  }
  .ann.show{opacity:1}
  .mapbox{border:1px solid var(--border);border-radius:14px;background:var(--card);padding:12px;margin-top:12px;overflow-x:auto}
  .maprow{display:flex;align-items:center;gap:0;min-width:max-content;padding:4px 0}
  .ms{display:flex;align-items:center;gap:0}
  .mdot{width:12px;height:12px;border-radius:50%;border:2px solid #fff;flex-shrink:0}
  .mseg{height:4px;width:26px;flex-shrink:0}
  .mlabel{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap}
  .mcur{outline:3px solid var(--warn);outline-offset:2px;border-radius:50%}
  .toggle{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);cursor:pointer}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);background:#000a;color:#fff;padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;z-index:50}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .note{font-size:12px;color:var(--muted);margin-top:14px;line-height:1.6}
  .empty{text-align:center;color:var(--muted);padding:30px 0}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="back" id="backBtn" title="返回">←</button>
    <div>
      <div class="title" id="title">中国地铁模拟器</div>
      <div class="sub" id="subtitle">选择一个城市开始</div>
    </div>
  </header>

  <!-- HOME -->
  <section id="home">
    <input class="search" id="search" placeholder="搜索城市，如 北京 / 上海 / 成都 …" />
    <div class="grid" id="cityGrid"></div>
    <div class="note">
      数据说明：线路名称、代表色与起讫站均为真实信息；非骨干线路的途经站为示意性罗列，
      用于驾驶模拟体验，具体运营站点请以官方为准。驾驶时用「加速 / 刹车」控制列车，进站需停在站台区内。
    </div>
  </section>

  <!-- CITY -->
  <section id="city" style="display:none">
    <div class="lines" id="lineList"></div>
    <div class="note">选择一条线路进入驾驶模拟。列车从起点站发车，沿途需在每一站站台区内平稳停车。</div>
  </section>

  <!-- PLAY -->
  <section id="play" style="display:none">
    <div class="hud">
      <span class="pill" id="hLine">线路</span>
      <span class="pill">站 <b id="hIdx">0</b>/<b id="hTot">0</b></span>
      <span class="pill">时速 <b id="hSpeed">0</b> km/h</span>
      <span class="pill">得分 <b id="hScore">0</b></span>
      <label class="toggle"><input type="checkbox" id="voi" checked /> 报站语音</label>
    </div>
    <div class="stage"><canvas id="cv"></canvas></div>
    <div class="ann" id="ann"></div>
    <div class="ctrl">
      <div class="btn brk" id="bBrake">🛑 刹车</div>
      <div class="btn acc" id="bAcc">🚀 加速</div>
      <div class="btn go" id="bDoor" style="display:none">🚪 关门发车</div>
    </div>
    <div class="mapbox"><div class="maprow" id="mapRow"></div></div>
  </section>
</div>
<div class="toast" id="toast"></div>

/* ===== 状态 ===== */
var cv, ctx, DPR=1;
var cur = {city:null, line:null, stations:[], color:"#3da9fc", idx:0, x:0, speed:0, doorOpen:false, docking:false, score:0, running:false, raf:0, dist:0, lineLen:0, seg:0, voice:true};

/* ===== 屏幕切换 ===== */
var elHome=document.getElementById('home'), elCity=document.getElementById('city'), elPlay=document.getElementById('play');
var elTitle=document.getElementById('title'), elSub=document.getElementById('subtitle');
function show(sec){
  elHome.style.display = sec==='home'?'block':'none';
  elCity.style.display = sec==='city'?'block':'none';
  elPlay.style.display = sec==='play'?'block':'none';
}
document.getElementById('backBtn').addEventListener('click', function(){
  if(elPlay.style.display==='block'){ stopGame(); show('city'); }
  else if(elCity.style.display==='block'){ show('home'); renderTitle(); }
  else { location.href = "../"; } // 返回上级（地铁模拟器菜单）
});

function renderTitle(){
  elTitle.textContent="中国地铁模拟器";
  elSub.textContent="选择一个城市开始";
}
function toast(msg){
  var t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(function(){t.classList.remove('show');},1800);
}

/* ===== 城市网格 ===== */
function renderCities(filter){
  var grid=document.getElementById('cityGrid'); grid.innerHTML='';
  var list = CITIES.filter(function(c){
    if(!filter) return true;
    return c.nm.indexOf(filter)>-1;
  });
  if(!list.length){ grid.innerHTML='<div class="empty">没有找到该城市</div>'; return; }
  list.forEach(function(c){
    var d=document.createElement('div'); d.className='city';
    d.innerHTML='<div class="em">'+c.em+'</div><div class="nm">'+c.nm+'</div><div class="ct">'+c.lines.length+' 条线</div>';
    d.addEventListener('click', function(){ openCity(c); });
    grid.appendChild(d);
  });
}
document.getElementById('search').addEventListener('input', function(e){ renderCities(e.target.value.trim()); });

function openCity(c){
  cur.city=c;
  elTitle.textContent=c.nm+" · 选择线路";
  elSub.textContent="共 "+c.lines.length+" 条线路";
  var box=document.getElementById('lineList'); box.innerHTML='';
  c.lines.forEach(function(ln){
    var el=document.createElement('div'); el.className='line';
    var term = ln.s[0]+" ⇄ "+ln.s[ln.s.length-1];
    el.innerHTML='<span class="dot" style="background:'+ln.c+'"></span>'+
      '<span class="meta"><span class="ln">'+ln.n+'</span><span class="st">'+term+' · '+ln.s.length+' 站</span></span>'+
      '<span class="go">进入 →</span>';
    el.addEventListener('click', function(){ startLine(c, ln); });
    box.appendChild(el);
  });
  show('city');
}

/* ===== 驾驶模拟 ===== */
function startLine(c, ln){
  cur.line=ln; cur.color=ln.c;
  cur.stations=ln.s.slice();
  cur.idx=0; cur.x=0; cur.speed=0; cur.doorOpen=false; cur.docking=false; cur.score=0; cur.running=true;
  cur.seg = Math.max(140, 360 - cur.stations.length*4); // 站间距（像素，折算后）
  cur.lineLen = cur.seg*(cur.stations.length-1);
  elTitle.textContent=c.nm+" "+ln.n;
  elSub.textContent="从 "+cur.stations[0]+" 发车";
  document.getElementById('hLine').textContent=ln.n;
  document.getElementById('hTot').textContent=cur.stations.length;
  document.getElementById('hIdx').textContent=0;
  document.getElementById('hScore').textContent=0;
  document.getElementById('hSpeed').textContent=0;
  document.getElementById('bDoor').style.display='none';
  buildMap();
  show('play');
  resize();
  announce("欢迎乘坐 "+c.nm+ln.n+"，本次列车开往 "+cur.stations[cur.stations.length-1]+" 方向");
  loop();
}
function resize(){
  if(!cv) cv=document.getElementById('cv');
  var stage=cv.parentElement;
  DPR=window.devicePixelRatio||1;
  cv.width=stage.clientWidth*DPR; cv.height=stage.clientHeight*DPR;
  ctx=cv.getContext('2d'); ctx.setTransform(DPR,0,0,DPR,0,0);
}
window.addEventListener('resize', function(){ if(elPlay.style.display==='block') resize(); });

var acc=false, brk=false;
function loop(){
  if(!cur.running) return;
  // 物理
  var maxV = 3.4; // 单位/帧
  if(cur.docking){
    // 进站停靠：强制减速
    cur.speed *= 0.82;
    if(cur.speed<0.04){ cur.speed=0; }
  } else {
    if(acc) cur.speed += 0.045;
    if(brk) cur.speed -= 0.10;
    if(!acc && !brk) cur.speed *= 0.985; // 轻微滑行阻力
    if(cur.speed<0) cur.speed=0;
    if(cur.speed>maxV) cur.speed=maxV;
  }
  cur.x += cur.speed;
  // 到站检测：接近下一站站台区
  if(cur.idx < cur.stations.length-1){
    var targetX = cur.seg*(cur.idx+1);
    var zone = 26; // 站台区半宽
    if(cur.x >= targetX - zone && cur.x <= targetX + zone){
      // 在站台区内且速度够低 -> 停靠成功
      if(cur.speed < 0.5 && !cur.docking){
        cur.docking=true;
        arriveStation();
      }
    } else if(cur.x > targetX + zone && !cur.docking){
      // 过站未停
      missStation();
    }
  } else {
    // 终点
    if(cur.x >= cur.lineLen - 2 && !cur.docking){
      cur.docking=true; terminate();
    }
  }
  draw();
  updateHud();
  cur.raf=requestAnimationFrame(loop);
}

function arriveStation(){
  cur.idx++;
  var smooth = cur.speed<0.18 ? 20 : (cur.speed<0.32?10:0);
  cur.score += 10 + smooth;
  var name = cur.stations[cur.idx];
  announce((cur.idx===cur.stations.length-1?"终点站 ":"")+name+" 到了，请便乘降");
  document.getElementById('hIdx').textContent=cur.idx;
  document.getElementById('hScore').textContent=cur.score;
  highlightMap();
  // 开门-关门
  cur.doorOpen=true;
  document.getElementById('bDoor').style.display='none';
  setTimeout(function(){
    cur.doorOpen=false;
    cur.docking=false;
    // 离站
    announce("开往 "+cur.stations[cur.stations.length-1]+" 方向，下一站 "+cur.stations[Math.min(cur.idx+1,cur.stations.length-1)]);
  }, 1100);
}
function missStation(){
  cur.idx++;
  cur.score = Math.max(0, cur.score-15);
  announce("⚠️ 未停靠 "+cur.stations[cur.idx]+"，本次扣分");
  document.getElementById('hIdx').textContent=cur.idx;
  document.getElementById('hScore').textContent=cur.score;
  highlightMap();
}
function terminate(){
  cur.running=false;
  cancelAnimationFrame(cur.raf);
  announce("列车到达终点 "+cur.stations[cur.stations.length-1]+"，本次得分 "+cur.score);
  toast("到达终点，得分 "+cur.score);
  document.getElementById('bDoor').style.display='none';
}
function stopGame(){
  cur.running=false;
  if(cur.raf) cancelAnimationFrame(cur.raf);
}

function updateHud(){
  document.getElementById('hSpeed').textContent=Math.round(cur.speed*22);
}
function announce(text){
  var a=document.getElementById('ann'); a.textContent=text; a.classList.add('show');
  clearTimeout(a._t); a._t=setTimeout(function(){a.classList.remove('show');}, 2200);
  if(cur.voice && window.speechSynthesis){
    try{
      window.speechSynthesis.cancel();
      var u=new SpeechSynthesisUtterance(text);
      u.lang='zh-CN'; u.rate=1.05; u.pitch=1;
      window.speechSynthesis.speak(u);
    }catch(e){}
  }
}

/* ===== 绘制 ===== */
function draw(){
  if(!ctx) return;
  var W=cv.width/DPR, H=cv.height/DPR;
  ctx.clearRect(0,0,W,H);
  // 天空渐变已由 CSS 提供，画地面与轨道
  var groundY=H*0.72;
  ctx.fillStyle = htmlLight()? "#c7d4e8" : "#0b1228";
  ctx.fillRect(0,groundY,W,H-groundY);
  // 隧道/远景
  ctx.fillStyle = htmlLight()? "rgba(120,150,190,.18)":"rgba(80,120,200,.12)";
  for(var i=0;i<6;i++){ ctx.fillRect((i*W/6 - (cur.x*0.2)% (W/6)), groundY-40, W/6-14, 40); }
  // 轨道
  ctx.strokeStyle = htmlLight()? "#7d8aa3":"#37405e";
  ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(0,groundY+14); ctx.lineTo(W,groundY+14); ctx.stroke();
  // 站台区（下一站）
  if(cur.idx < cur.stations.length-1){
    var tx = stationScreenX(cur.idx+1);
    ctx.fillStyle = "rgba(94,224,160,.20)";
    ctx.fillRect(tx-26, groundY-2, 52, 20);
    ctx.fillStyle = htmlLight()? "#1faa6a":"#5ee0a0";
    ctx.fillRect(tx-26, groundY+8, 52, 4);
    ctx.fillStyle = htmlLight()? "#16203a":"#cfe";
    ctx.font="11px sans-serif"; ctx.textAlign="center";
    ctx.fillText(cur.stations[cur.idx+1], tx, groundY-8);
  }
  // 列车
  var trainX = cur.x; // 逻辑坐标≈屏幕坐标（以起点为左）
  // 让列车大致居中：相机跟随
  var camX = Math.max(0, trainX - W*0.35);
  var sx = trainX - camX;
  drawTrain(sx, groundY);
  // 起点站标记
  drawStationLabel(0 - camX, groundY, cur.stations[0], true);
  // HUD 顶部进度
  ctx.fillStyle = htmlLight()? "rgba(20,30,50,.06)":"rgba(255,255,255,.05)";
  ctx.fillRect(0,0,W,6);
  ctx.fillStyle = cur.color;
  ctx.fillRect(0,0, W*(cur.idx/(cur.stations.length-1||1)), 6);
}
function stationScreenX(i){
  // 屏幕坐标（相机跟随，列车居中 35%）
  var camX=Math.max(0, cur.x - (cv.width/DPR)*0.35);
  return cur.seg*i - camX;
}
function drawStationLabel(sx, groundY, name, isStart){
  if(sx<-60||sx>cv.width/DPR+60) return;
  ctx.fillStyle = htmlLight()? "#5a667e":"#9aa6bd";
  ctx.font="11px sans-serif"; ctx.textAlign="center";
  ctx.fillText(name, sx, groundY+30);
}
function drawTrain(x, groundY){
  var w=86, h=34;
  ctx.fillStyle = cur.color;
  roundRect(x-w/2, groundY-h+6, w, h, 8); ctx.fill();
  // 车窗
  ctx.fillStyle = "rgba(255,255,255,.85)";
  for(var i=0;i<3;i++){ ctx.fillRect(x-w/2+12+i*22, groundY-h+12, 14, 12); }
  // 车头灯
  ctx.fillStyle="#ffe9a8"; ctx.beginPath(); ctx.arc(x+w/2-6, groundY-8, 3, 0, 7); ctx.fill();
  // 阴影
  ctx.fillStyle="rgba(0,0,0,.25)"; ctx.beginPath(); ctx.ellipse(x, groundY+16, w/2, 5, 0, 0, 7); ctx.fill();
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }
function htmlLight(){ return document.documentElement.getAttribute('data-theme')==='light'; }

/* ===== 线路图 ===== */
function buildMap(){
  var row=document.getElementById('mapRow'); row.innerHTML='';
  cur.stations.forEach(function(st,i){
    var dot=document.createElement('span'); dot.className='mdot'; dot.style.background=cur.color; dot.id='mdot'+i;
    dot.style.borderColor = htmlLight()? "#16203a":"#fff";
    var seg=document.createElement('span'); seg.className='mseg'; seg.style.background=cur.color;
    var lab=document.createElement('div'); lab.className='mlabel'; lab.id='mlab'+i; lab.textContent=st;
    var wrap=document.createElement('span'); wrap.className='ms'; wrap.style.flexDirection='column'; wrap.style.alignItems='center';
    var top=document.createElement('span'); top.style.display='flex'; top.style.alignItems='center';
    top.appendChild(dot);
    if(i<cur.stations.length-1) top.appendChild(seg);
    wrap.appendChild(top); wrap.appendChild(lab);
    row.appendChild(wrap);
  });
  highlightMap();
}
function highlightMap(){
  for(var i=0;i<cur.stations.length;i++){
    var d=document.getElementById('mdot'+i), l=document.getElementById('mlab'+i);
    if(d) d.className='mdot'+(i===cur.idx?' mcur':'');
    if(l) l.style.color = i===cur.idx ? (cur.color) : (htmlLight()?"#5a667e":"#9aa6bd");
  }
}

/* ===== 控制 ===== */
function bindBtn(id, on, off){
  var el=document.getElementById(id);
  var set=function(v){ if(v) on(); else off(); };
  el.addEventListener('touchstart', function(e){ e.preventDefault(); set(true); }, {passive:false});
  el.addEventListener('touchend', function(e){ e.preventDefault(); set(false); }, {passive:false});
  el.addEventListener('mousedown', function(e){ e.preventDefault(); set(true); });
  el.addEventListener('mouseup', function(){ set(false); });
  el.addEventListener('mouseleave', function(){ set(false); });
}
bindBtn('bAcc', function(){ acc=true; }, function(){ acc=false; });
bindBtn('bBrake', function(){ brk=true; }, function(){ brk=false; });
document.getElementById('bDoor').addEventListener('click', function(){
  if(cur.docking && cur.doorOpen){ cur.doorOpen=false; cur.docking=false; }
});
document.addEventListener('keydown', function(e){
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'){ acc=true; }
  if(e.key==='ArrowDown'||e.key==='s'||e.key==='S'){ brk=true; }
});
document.addEventListener('keyup', function(e){
  if(e.key==='ArrowUp'||e.key==='w'||e.key==='W'){ acc=false; }
  if(e.key==='ArrowDown'||e.key==='s'||e.key==='S'){ brk=false; }
});
document.getElementById('voi').addEventListener('change', function(e){ cur.voice=e.target.checked; });

/* ===== 初始化 ===== */
(function(){ try{ var t=localStorage.getItem('theme'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){} })();
window.addEventListener('load', function(){ resize(); });
renderCities('');
renderTitle();
</script>
