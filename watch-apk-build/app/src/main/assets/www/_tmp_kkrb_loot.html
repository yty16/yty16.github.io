<script>

    function rippleViewTransition(isDark, callback) {
        const x = window.innerWidth;
        const y = 0;
        const endRadius = Math.hypot(
            Math.max(x, window.innerWidth - x),
            Math.max(y, window.innerHeight - y)
        );
        
        const transition = document.startViewTransition(() => {
            callback && callback();
        });
        
        transition.ready.then(() => {
            var clipPath = [`circle(0px at ${x}px ${y}px)`, `circle(${endRadius}px at ${x}px ${y}px)`];
            document.documentElement.animate(
                {
                    clipPath: isDark ? clipPath : [...clipPath].reverse(),
                },
                {
                    duration: 300,
                    easing: 'ease-in',
                    pseudoElement: isDark ? '::view-transition-new(root)' : '::view-transition-old(root)',
                }
            );
        });
    }

    function consumeOauthFlashMessage(layer) {
        const url = new URL(window.location.href);
        const oauthStatus = url.searchParams.get('oauth_status');
        const oauthMsg = url.searchParams.get('oauth_msg');

        if (!oauthStatus || !oauthMsg) {
            return;
        }

        layer.msg(decodeURIComponent(oauthMsg), {
            icon: oauthStatus === 'success' ? 1 : 2
        });

        url.searchParams.delete('oauth_status');
        url.searchParams.delete('oauth_msg');
        window.history.replaceState({}, '', url.pathname + (url.searchParams.toString() ? '?' + url.searchParams.toString() : ''));
    }

            onChanged(mode, defaultHandler) {

                    defaultHandler();

        function escapeCollectionFormHtml(value) {
            return String(value == null ? '' : value)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function normalizeCollectionFormOptions(options) {
            if (!Array.isArray(options)) {
                return [];
            }

            return options
                .map(function(option) {
                    if (typeof option === 'string' || typeof option === 'number') {
                        const text = String(option);
                        return {
                            value: text,
                            label: text,
                            custom: 0
                        };
                    }

                    if (!option || typeof option !== 'object') {
                        return null;
                    }

                    const value = option.value != null ? String(option.value) : '';
                    const label = option.label != null ? String(option.label) : value;

                    if (!value || !label) {
                        return null;
                    }

                    return {
                        value: value,
                        label: label,
                        custom: Number(option.custom) === 1 ? 1 : 0
                    };
                })
                .filter(Boolean);
        }

        function buildCollectionFormOptionMeta(field) {
            const fieldConfig = field && typeof field === 'object' ? field : {};
            const fieldCustomEnabled = Number(fieldConfig.custom) === 1;
            const options = fieldConfig.options;
            const normalizedOptions = normalizeCollectionFormOptions(options);
            const optionCustomEnabled = normalizedOptions.some(function(option) {
                return Number(option.custom) === 1;
            });
            const hasCustom = fieldCustomEnabled || optionCustomEnabled;

            if (hasCustom) {
                normalizedOptions.push({
                    value: '__custom__',
                    label: '其他',
                    custom: 1,
                    isSyntheticCustom: 1
                });
            }

            return {
                options: normalizedOptions,
                hasCustom: hasCustom
            };
        }

        function getCollectionCustomInputName(fieldKey) {
            return fieldKey + '__custom_text';
        }

        function toggleCollectionCustomInput(fieldKey, fieldType, container) {
            const customInputName = getCollectionCustomInputName(fieldKey);
            const customWrap = container.find('[data-custom-wrap="' + fieldKey + '"]');
            let shouldShow = false;

            if (fieldType === 'checkbox') {
                shouldShow = container.find("input[name='" + fieldKey + "[]'][value='__custom__']:checked").length > 0;
            } else if (fieldType === 'radio') {
                shouldShow = container.find("input[name='" + fieldKey + "'][value='__custom__']:checked").length > 0;
            }

            if (shouldShow) {
                customWrap.show();
            } else {
                customWrap.hide();
                container.find('[name="' + customInputName + '"]').val('');
            }
        }

        function initCollectionFormCustomInputs(container, fields) {
            fields.forEach(function(field) {
                const fieldKey = String(field.key_name || '');
                const fieldType = String(field.type || '').toLowerCase();
                const optionMeta = buildCollectionFormOptionMeta(field);

                if (!fieldKey || !optionMeta.hasCustom || !['radio', 'checkbox'].includes(fieldType)) {
                    return;
                }

                container.off('change.collectionCustom_' + fieldKey);
                container.off('click.collectionCustom_' + fieldKey);
                if (fieldType === 'checkbox') {
                    container.on('change.collectionCustom_' + fieldKey, "input[name='" + fieldKey + "[]']", function() {
                        toggleCollectionCustomInput(fieldKey, fieldType, container);
                    });
                    container.on('click.collectionCustom_' + fieldKey, "input[name='" + fieldKey + "[]'] + div", function() {
                        setTimeout(function() {
                            toggleCollectionCustomInput(fieldKey, fieldType, container);
                        }, 0);
                    });
                } else {
                    container.on('change.collectionCustom_' + fieldKey, "input[name='" + fieldKey + "']", function() {
                        toggleCollectionCustomInput(fieldKey, fieldType, container);
                    });
                    container.on('click.collectionCustom_' + fieldKey, "input[name='" + fieldKey + "'] + div", function() {
                        setTimeout(function() {
                            toggleCollectionCustomInput(fieldKey, fieldType, container);
                        }, 0);
                    });
                }

                setTimeout(function() {
                    toggleCollectionCustomInput(fieldKey, fieldType, container);
                }, 0);
            });
        }

        function buildCollectionFormFieldHtml(field, formUniqueId) {
            const fieldType = String(field.type || '').toLowerCase();
            const fieldKey = String(field.key_name || '');
            const fieldLabel = escapeCollectionFormHtml(field.label || fieldKey);
            const placeholder = escapeCollectionFormHtml(field.placeholder || '');
            const required = Number(field.required) === 1;
            const verifyAttr = required ? ' lay-verify="required"' : '';
            const requiredMark = required ? '<span style="color:#FF5722;"> *</span>' : '';
            const optionMeta = buildCollectionFormOptionMeta(field);
            const options = optionMeta.options;
            const hasCustom = optionMeta.hasCustom;
            const customInputName = getCollectionCustomInputName(fieldKey);
            const customPlaceholder = escapeCollectionFormHtml(field.custom_placeholder || '请输入其他内容');

            if (!fieldKey || !fieldLabel) {
                return '';
            }

            if (fieldType === 'radio') {
                const radios = options.map(function(option) {
                    const optionValue = escapeCollectionFormHtml(option.value);
                    const optionLabel = escapeCollectionFormHtml(option.label);
                    return '<input type="radio" name="' + fieldKey + '" value="' + optionValue + '" title="' + optionLabel + '"' + verifyAttr + '>';
                }).join('');
                const customHtml = hasCustom ? `
                    <div class="collection-form-custom-wrap" data-custom-wrap="${fieldKey}" style="display:none; margin-top: 10px;">
                        <input type="text" name="${customInputName}" placeholder="${customPlaceholder}" autocomplete="off" class="layui-input">
                    </div>
                ` : '';

                return `
                    <div class="layui-form-item">
                        <label class="layui-form-label collection-form-label">${fieldLabel}${requiredMark}</label>
                        <div class="layui-input-block">
                            ${radios}
                            ${customHtml}
                        </div>
                    </div>
                `;
            }

            if (fieldType === 'checkbox') {
                const checkboxes = options.map(function(option) {
                    const optionValue = escapeCollectionFormHtml(option.value);
                    const optionLabel = escapeCollectionFormHtml(option.label);
                    return '<input type="checkbox" name="' + fieldKey + '[]" value="' + optionValue + '" title="' + optionLabel + '">';
                }).join('');
                const customHtml = hasCustom ? `
                    <div class="collection-form-custom-wrap" data-custom-wrap="${fieldKey}" style="display:none; margin-top: 10px;">
                        <input type="text" name="${customInputName}" placeholder="${customPlaceholder}" autocomplete="off" class="layui-input">
                    </div>
                ` : '';

                return `
                    <div class="layui-form-item">
                        <label class="layui-form-label collection-form-label">${fieldLabel}${requiredMark}</label>
                        <div class="layui-input-block">
                            ${checkboxes}
                            ${customHtml}
                        </div>
                    </div>
                `;
            }

            if (fieldType === 'textarea') {
                return `
                    <div class="layui-form-item layui-form-text">
                        <label class="layui-form-label collection-form-label">${fieldLabel}${requiredMark}</label>
                        <div class="layui-input-block">
                            <textarea name="${fieldKey}"${verifyAttr} placeholder="${placeholder}" class="layui-textarea"></textarea>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="layui-form-item">
                    <label class="layui-form-label collection-form-label">${fieldLabel}${requiredMark}</label>
                    <div class="layui-input-block">
                        <input type="text" name="${fieldKey}"${verifyAttr} placeholder="${placeholder}" autocomplete="off" class="layui-input">
                    </div>
                </div>
            `;
        }

        function collectCollectionFormAnswers(fields, dataField) {
            const answers = {};
            let missingFieldLabel = '';

            fields.forEach(function(field) {
                const fieldKey = String(field.key_name || '');
                const fieldType = String(field.type || '').toLowerCase();
                const required = Number(field.required) === 1;
                const optionMeta = buildCollectionFormOptionMeta(field);
                const hasCustom = optionMeta.hasCustom;
                const customInputName = getCollectionCustomInputName(fieldKey);
                const customText = typeof dataField[customInputName] === 'string' ? dataField[customInputName].trim() : '';

                if (!fieldKey) {
                    return;
                }

                let fieldValue = dataField[fieldKey];

                if (fieldType === 'checkbox') {
                    fieldValue = [];
                    $("input[name='" + fieldKey + "[]']:checked").each(function() {
                        fieldValue.push($(this).val());
                    });

                    if (required && fieldValue.length === 0 && !missingFieldLabel) {
                        missingFieldLabel = field.label || fieldKey;
                    }

                    if (hasCustom && fieldValue.includes('__custom__') && customText === '' && !missingFieldLabel) {
                        missingFieldLabel = (field.label || fieldKey) + '（其他内容）';
                    }
                } else {
                    if (typeof fieldValue === 'string') {
                        fieldValue = fieldValue.trim();
                    }

                    if (required && (fieldValue === undefined || fieldValue === null || fieldValue === '') && !missingFieldLabel) {
                        missingFieldLabel = field.label || fieldKey;
                    }

                    if (fieldType === 'radio' && hasCustom && fieldValue === '__custom__' && customText === '' && !missingFieldLabel) {
                        missingFieldLabel = (field.label || fieldKey) + '（其他内容）';
                    }
                }

                answers[fieldKey] = fieldValue;
                if (hasCustom) {
                    answers[customInputName] = customText;
                }
            });

            return {
                answers: answers,
                missingFieldLabel: missingFieldLabel
            };
        }

                `,
                success: function(layero, index){
                    const ctx = document.getElementById('itemChart').getContext('2d');
                    var itemChart = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels.map(formatDateTime),
                            datasets: [{
                                label: itemName,
                                data: values,
                                borderColor: getRandomColor(),

                            }]
                        },

                                y: {
                                    beginAtZero: false,

                                    }
                                },
                                x: {
                                    title: {
                                        display: true,
                                        text: '时间'
                                    }
                                }
                            },
                            plugins: {
                                legend: {
                                    display: true,
                                    position: 'top',
                                    labels: {
                                        usePointStyle: true,
                                        pointStyle: 'circle',
                                        generateLabels: function(chart) {
                                            return chart.data.datasets.map((dataset, i) => {
                                                const meta = chart.getDatasetMeta(i);
                                                const hidden = meta.hidden || chart.data.datasets[i].hidden;
                                                return {
                                                    text: dataset.label,
                                                    fillStyle: '#F0F0F0',
                                                    strokeStyle: dataset.borderColor,
                                                    lineWidth: dataset.borderWidth + 2,
                                                    hidden: hidden,
                                                    fontColor: hidden ? 'gray' : dataset.borderColor,
                                                    datasetIndex: i
                                                };
                                            });
                                        }
                                    },
                                    onClick: function(e, legendItem, legend) {
                                        const index = legendItem.datasetIndex;
                                        const ci = legend.chart;
                                        const meta = ci.getDatasetMeta(index);
                                        const dataset = ci.data.datasets[index];
                                        meta.hidden = meta.hidden === null ? !ci.data.datasets[index].hidden : null;
                                        dataset.hidden = meta.hidden;
                                        ci.update();
                                    }
                                }
                            }
                        }
                    });
                    
                    // 移动端图表优化开始
                    let touchStartX = 0;
                    let touchEndX = 0;
                    let isPanning = false;

                    const canvas = document.getElementById('itemChart');

                    canvas.addEventListener('touchstart', (e) => {
                        isPanning = true;
                        touchStartX = e.touches[0].clientX;
                    });

                    canvas.addEventListener('touchmove', (e) => {
                        if (isPanning) {
                            touchEndX = e.touches[0].clientX;
                            const deltaX = touchStartX - touchEndX;
                            const sensitivity = 0.1;
                            const step = deltaX * sensitivity;

                            const xScale = itemChart.options.scales.x;
                            xScale.min = (xScale.min ?? 0) + step;
                            xScale.max = (xScale.max ?? itemChart.data.labels.length) + step;

                            if (xScale.min < 0) {
                                xScale.min = 0;
                                xScale.max = Math.min(10, itemChart.data.labels.length);
                            } else if (xScale.max > itemChart.data.labels.length) {
                                xScale.max = itemChart.data.labels.length;
                                xScale.min = Math.max(0, itemChart.data.labels.length - 10);
                            }

                            itemChart.update();
                            touchStartX = touchEndX;
                        }
                    });

                    canvas.addEventListener('touchend', () => {
                        isPanning = false;
                    });
                    // 移动端图表优化结束
                    
                    if (typeof window.plausible !== 'undefined' && typeof window.plausible === 'function') {
                        window.plausible('ViewPriceCurve', {

                        });
                    } else {
                        console.log('Plausible tracking is not initialized.');
                    }
                }
            });

        return /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent);
    }

    function getCookieValue(name) {
        const cookieName = `${name}=`;
        const cookieItems = document.cookie ? document.cookie.split('; ') : [];

        for (const item of cookieItems) {
            if (item.indexOf(cookieName) === 0) {
                return decodeURIComponent(item.substring(cookieName.length));
            }
        }

        return '';
    }
    
    function formatDateTime(key) {
        var match = key.match(/^(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})?$/);
        if (match) {
            var year  = match[1].slice(-2);
            var month = match[2];
            var day   = match[3];
            var hour  = match[4];
            var minute = match[5];
            
            if (minute) {
                return `${year}/${month}/${day} ${hour}时${minute}分`;
            } else {
                return `${year}/${month}/${day} ${hour}时`;
            }
        }
        return key;
    }
    
    function getRandomColor() {
        const letters = '0123456789ABCDEF';
        const maxTries = 100;
        let tryCount = 0;
        
        while (tryCount < maxTries) {
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            
            if (!isColorTooBright(color)) {
                return color;
            }
            tryCount++;
        }
        
        return '#333333';
    }
    
    function isColorTooBright(hexColor) {
        const r = parseInt(hexColor.substr(1, 2), 16) / 255;
        const g = parseInt(hexColor.substr(3, 2), 16) / 255;
        const b = parseInt(hexColor.substr(5, 2), 16) / 255;
        
        const luminance = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        return luminance > 0.7;
    }
    
    function getRandomString(length = 12) {
        const letters = '0123456789abcdefghijklmnpqrstuvwxyz';
        let string = '';
        for (let i = 0; i < length; i++) {
            string += letters[Math.floor(Math.random() * 16)];
        }
        return string;
    }
    
    function throttle(fn, delay) {
        var timer = null;
        return function () {
            if (!timer) {
                timer = setTimeout(function () {
                    fn();
                    timer = null;
                }, delay);
            }
        };
    }
