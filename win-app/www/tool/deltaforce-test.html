<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>战场人格测试 - 元拓域 Toolbox</title>
<style>
:root{--bg:#f0f2f5;--card:rgba(255,255,255,0.85);--text:#1a1a2e;--muted:#a0aec0;--accent:#6366f1;--accent-hover:#4f46e5;--border:rgba(0,0,0,0.06);--shadow:0 4px 16px rgba(0,0,0,0.08)}
[data-theme="dark"]{--bg:#0f0f1a;--card:rgba(30,30,50,0.85);--text:#e2e8f0;--muted:#718096;--accent:#818cf8;--border:rgba(255,255,255,0.06);--shadow:0 4px 16px rgba(0,0,0,0.3)}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; transition: background 0.3s, color 0.3s; }
.back-btn { position: fixed; top: 20px; left: 20px; z-index: 100; display: inline-flex; align-items: center; gap: 6px; padding: 8px 16px; background: var(--card); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); border: 1px solid var(--border); border-radius: 10px; color: var(--text); text-decoration: none; font-size: 14px; font-weight: 500; box-shadow: var(--shadow); transition: all 0.2s; }
.back-btn:hover { background: var(--accent); color: #fff; }
.wrap { max-width: 640px; margin: 0 auto; padding: 80px 20px 60px; text-align: center; }
h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
.sub { font-size: 15px; color: var(--muted); margin-top: 10px; }
.intro { margin: 28px 0; font-size: 14px; color: var(--muted); line-height: 1.8; }
.primary-btn { display: inline-block; padding: 13px 36px; background: var(--accent); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; }
.primary-btn:hover { background: var(--accent-hover); transform: translateY(-2px); }
.progress { height: 6px; background: var(--border); border-radius: 4px; overflow: hidden; margin: 24px 0 8px; }
.progress > span { display: block; height: 100%; background: var(--accent); width: 0; transition: width 0.3s; }
.q-count { font-size: 13px; color: var(--muted); }
.q-text { font-size: 19px; font-weight: 600; margin: 26px 0 22px; line-height: 1.6; }
.opts { display: flex; flex-direction: column; gap: 12px; }
.opt { padding: 16px 18px; background: var(--card); border: 1px solid var(--border); border-radius: 14px; text-align: left; font-size: 15px; cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow); }
.opt:hover { border-color: var(--accent); transform: translateY(-2px); }
.result-card { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 34px 26px; box-shadow: var(--shadow); margin-top: 20px; }
.result-emoji { font-size: 56px; }
.result-name { font-size: 26px; font-weight: 700; margin: 12px 0 6px; }
.result-tag { display: inline-block; padding: 4px 14px; border-radius: 20px; background: var(--accent); color: #fff; font-size: 13px; margin-bottom: 16px; }
.result-desc { font-size: 15px; color: var(--muted); line-height: 1.9; text-align: left; }
.bars { margin: 22px 0 6px; text-align: left; }
.bar-row { display: flex; align-items: center; gap: 10px; margin: 8px 0; font-size: 13px; }
.bar-row .lab { width: 76px; color: var(--muted); flex-shrink: 0; }
.bar-row .track { flex: 1; height: 10px; background: var(--border); border-radius: 6px; overflow: hidden; }
.bar-row .fill { display: block; height: 100%; background: var(--accent); border-radius: 6px; }
.bar-row .val { width: 34px; text-align: right; color: var(--muted); }
.hidden { display: none; }
.note { font-size: 12px; color: var(--muted); margin-top: 22px; }
@media (max-width: 600px) { h1 { font-size: 22px; } .wrap { padding: 70px 16px 40px; } }
</style>

<div class="wrap">

  <!-- 开始页 -->
  <div id="startView">
    <h1>🎯 战场人格测试</h1>
    <p class="sub">在三角洲的战场上，你究竟是什么样的战士？</p>
    <div class="intro">
      20 道战场场景还原题，没有标准答案。<br>
      通关后解锁你的专属作战人格档案，看看你更偏向哪一种作战风格。
    </div>
    <button class="primary-btn" id="startBtn">开始测试 →</button>
    <p class="note">本测试为原创趣味测评，结果与任何官方设定无关，仅供娱乐。</p>
  </div>

  <!-- 答题页 -->
  <div id="quizView" class="hidden">
    <div class="progress"><span id="progBar"></span></div>
    <div class="q-count" id="qCount"></div>
    <div class="q-text" id="qText"></div>
    <div class="opts" id="opts"></div>
  </div>

  <!-- 结果页 -->
  <div id="resultView" class="hidden">
    <div class="result-card">
      <div class="result-emoji" id="rEmoji"></div>
      <div class="result-name" id="rName"></div>
      <span class="result-tag" id="rTag"></span>
      <div class="result-desc" id="rDesc"></div>
      <div class="bars" id="rBars"></div>
    </div>
    <button class="primary-btn" id="againBtn" style="margin-top:24px">再测一次</button>
    <p class="note">原创趣味测评，数据仅保存在本机，不上传服务器。</p>
  </div>

</div>

<script>
var QUESTIONS = [
  { q: "你降落在零号大坝，刚落地还没摸清敌情，你会？", o: [ {t:"直奔最近的交火点，抢先占住有利地形",d:0}, {t:"先爬到高处用镜把周围动静扫一遍",d:1}, {t:"先找队友汇合，互相架枪再稳妥推进",d:2}, {t:"打开地图规划整队的推进路线",d:3} ] },
  { q: "小队在长弓溪谷推进，前方一栋楼疑似有埋伏，你提议？", o: [ {t:"直接破门，把里面的人清掉",d:0}, {t:"先丢侦查装备或无人机看清楚再进",d:1}, {t:"让突击手在前，我在门口架枪掩护",d:2}, {t:"先标记位置，全队同步后再行动",d:3} ] },
  { q: "你摸到一把满改稀有枪，但队友的主武器刚被打坏，你？", o: [ {t:"自己换上，火力更重要",d:0}, {t:"我先评估一下战局信息再决定给谁",d:1}, {t:"直接让给队友，我用手里的凑合",d:2}, {t:"收进公共仓库，按战局需要分配",d:3} ] },
  { q: "撤离点就在眼前，但身后是穷追不舍的敌方小队，你？", o: [ {t:"转身反打，先解决威胁再撤",d:0}, {t:"边撤边回头，找机会甩掉他们",d:1}, {t:"断后掩护，让队友先上撤离点",d:2}, {t:"指挥大家分两路，一路牵制一路撤",d:3} ] },
  { q: "你在楼里听到楼上有脚步声，却判断不清人数，你？", o: [ {t:"上楼直接干，先手优势最重要",d:0}, {t:"贴墙静步靠近，先确认再动手",d:1}, {t:"守住楼梯口，等队友上来一起清",d:2}, {t:"在队伍频道报点，统一安排谁上",d:3} ] },
  { q: "一场大战场对抗，你的固定位置通常是？", o: [ {t:"冲在最前面的突击位",d:0}, {t:"侧翼或高点的信息位",d:1}, {t:"跟在突击手后面的火力/医疗位",d:2}, {t:"后方观察全局、发号施令的位",d:3} ] },
  { q: "你更享受哪一种击杀？", o: [ {t:"正面刚枪、一打多的残局",d:0}, {t:"提前架枪，等敌人进圈的精准一枪",d:1}, {t:"和队友交叉火力配合收掉对方",d:2}, {t:"靠信息差让全队吃掉对面",d:3} ] },
  { q: "队友倒地失血，敌人在 30 米外火力压制，你？", o: [ {t:"冒着枪线冲过去把他拉起来就跑",d:0}, {t:"先扔烟或闪光开路再救人",d:1}, {t:"架枪压制敌人，给救援创造窗口",d:2}, {t:"呼叫全队集火压制，统一节奏救",d:3} ] },
  { q: "你们摸到一个富得流油的物资点，但时间紧迫，你？", o: [ {t:"看见好东西立马开摸，能拿多少拿多少",d:0}, {t:"先警戒四周，确认安全再搜",d:1}, {t:"帮队友一起搬，优先保住重要物资",d:2}, {t:"按撤离载重分配，谁空谁多拿",d:3} ] },
  { q: "一局结束复盘，你最在意的数据是？", o: [ {t:"淘汰数与输出",d:0}, {t:"侦察、标记与信息贡献",d:1}, {t:"救援、助攻与架枪时长",d:2}, {t:"胜负与团队执行度",d:3} ] },
  { q: "敌方直升机或装甲车压境，你的第一反应？", o: [ {t:"抄起火箭筒或重武就上",d:0}, {t:"先找掩体观察它的巡逻路线",d:1}, {t:"提醒队友散开，别扎堆被扫",d:2}, {t:"指挥大家集火弱点或绕后",d:3} ] },
  { q: "你带新人打，第一堂课最想教什么？", o: [ {t:"身法走位和刚枪节奏",d:0}, {t:"怎么看小地图和点位信息",d:1}, {t:"怎么和队友配合补位架枪",d:2}, {t:"怎么读局势、做决策",d:3} ] },
  { q: "信号枪或召唤物在手，你更想叫来什么？", o: [ {t:"空中火力覆盖，直接炸",d:0}, {t:"侦察无人机，先把全场看清",d:1}, {t:"补给空投，给全队补状态",d:2}, {t:"增援部队，补齐编制再打",d:3} ] },
  { q: "你眼里的「好队友」第一条是？", o: [ {t:"枪刚、敢冲",d:0}, {t:"眼尖、报点准",d:1}, {t:"靠谱、会保人",d:2}, {t:"脑子清楚、会带节奏",d:3} ] },
  { q: "比赛打逆风了，你会怎么做？", o: [ {t:"更凶地找对面单挑翻盘",d:0}, {t:"悄悄绕后偷点，打乱对面节奏",d:1}, {t:"死死咬住队友，稳住防线",d:2}, {t:"重新布置战术，调动全队",d:3} ] },
  { q: "你更喜欢用什么方式获取情报？", o: [ {t:"直接去前线碰，打了才知道",d:0}, {t:"无人机、望远镜、听声辨位",d:1}, {t:"问队友都看到了什么",d:2}, {t:"综合各方信息再做判断",d:3} ] },
  { q: "弹药见底，补给还在半张图外，你？", o: [ {t:"抄近路冲过去抢",d:0}, {t:"沿途摸敌方尸体捡能用的",d:1}, {t:"向队友要几梭子先顶着",d:2}, {t:"指挥大家先收缩防线、省子弹",d:3} ] },
  { q: "你们占领了据点，但四面都是敌人，你？", o: [ {t:"主动出击，把威胁扼杀在门外",d:0}, {t:"在外围游走放哨，提前预警",d:1}, {t:"守在入口，给据点当盾",d:2}, {t:"分配各人守点方向，统一调度",d:3} ] },
  { q: "赛季冲分，你的核心打法是？", o: [ {t:"靠个人能力 carry，能打就打",d:0}, {t:"信息流打法，靠预判吃分",d:1}, {t:"抱团运营，靠配合稳住",d:2}, {t:"大局运营，靠决策取胜",d:3} ] },
  { q: "如果只能用一句话形容你的打法，是？", o: [ {t:"「冲就完了」",d:0}, {t:"「先看清再动」",d:1}, {t:"「我替你扛」",d:2}, {t:"「听我指挥」",d:3} ] }
];

var DIM = [
  { key: "突击", color: "#ef4444" },
  { key: "侦察", color: "#3b82f6" },
  { key: "支援", color: "#10b981" },
  { key: "指挥", color: "#f59e0b" }
];

var PROFILES = {
  突击: { emoji: "🔥", name: "破阵先锋", tag: "主战型 · 突击", desc: "你天生为突破而生。枪线就是你的语言，见到缺口就想撕开它。冲动但可靠，残局里最让人安心的总是你那句“我上了”。提醒：偶尔慢半拍，队友会更喜欢你。" },
  侦察: { emoji: "🛰️", name: "暗影斥候", tag: "感知型 · 侦察", desc: "你有一双停不下来的眼睛。别人看热闹，你看点位、看视野、看敌人的破绽。沉默却关键，队伍里最值钱的信息往往来自你。提醒：别光看，偶尔也要扣扳机。" },
  支援: { emoji: "🛡️", name: "铁壁卫士", tag: "守护型 · 支援", desc: "你把“背后交给我”当真。补位、架枪、递弹药，你让所有人打得更有底气。团队里最稳的那块地基，就是你。提醒：别把自己燃尽了，你也值得被护着。" },
  指挥: { emoji: "🧠", name: "运筹统帅", tag: "谋略型 · 指挥", desc: "你习惯先想三步再动手。局势乱成一团时，你反而最清醒。大家乱枪中听到的那句“听我指挥”，多半来自你。提醒：别想太多耽误了出手时机。" }
};

var cur = 0;
var score = [0, 0, 0, 0];

var startView = document.getElementById('startView');
var quizView = document.getElementById('quizView');
var resultView = document.getElementById('resultView');

function startQuiz() {
  cur = 0; score = [0, 0, 0, 0];
  startView.classList.add('hidden');
  resultView.classList.add('hidden');
  quizView.classList.remove('hidden');
  renderQ();
}

function shuffleArr(arr) {
  for (var i = arr.length - 1; i > 0; i--) {
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}

var curOpts = [];

function renderQ() {
  var item = QUESTIONS[cur];
  document.getElementById('qCount').textContent = '第 ' + (cur + 1) + ' / ' + QUESTIONS.length + ' 题';
  document.getElementById('progBar').style.width = ((cur / QUESTIONS.length) * 100) + '%';
  document.getElementById('qText').textContent = item.q;
  var box = document.getElementById('opts');
  box.innerHTML = '';
  // 每题选项随机打乱，避免位置惯性、增加重测新鲜感
  curOpts = shuffleArr(item.o.slice());
  curOpts.forEach(function (opt) {
    var b = document.createElement('button');
    b.className = 'opt';
    b.textContent = opt.t;
    b.onclick = function () { pick(opt.d); };
    box.appendChild(b);
  });
}

function pick(dim) {
  score[dim]++;
  cur++;
  if (cur >= QUESTIONS.length) {
    document.getElementById('progBar').style.width = '100%';
    showResult();
  } else {
    renderQ();
  }
}

function showResult() {
  quizView.classList.add('hidden');
  resultView.classList.remove('hidden');
  var max = 0;
  for (var i = 1; i < 4; i++) { if (score[i] > score[max]) max = i; }
  var total = score[0] + score[1] + score[2] + score[3];
  var p = PROFILES[DIM[max].key];
  document.getElementById('rEmoji').textContent = p.emoji;
  document.getElementById('rName').textContent = p.name;
  document.getElementById('rTag').textContent = p.tag;
  document.getElementById('rDesc').textContent = p.desc;
  var bars = document.getElementById('rBars');
  bars.innerHTML = '';
  DIM.forEach(function (d, i) {
    var pct = Math.round((score[i] / total) * 100);
    var row = document.createElement('div');
    row.className = 'bar-row';
    row.innerHTML = '<span class="lab">' + d.key + '</span>' +
      '<span class="track"><span class="fill" style="width:' + pct + '%;background:' + d.color + '"></span></span>' +
      '<span class="val">' + pct + '%</span>';
    bars.appendChild(row);
  });
}

document.getElementById('startBtn').onclick = startQuiz;
document.getElementById('againBtn').onclick = function () {
  resultView.classList.add('hidden');
  startView.classList.remove('hidden');
};
</script>
